palette = "noctalia"
add_newline = true

format = "$username$directory$character"
right_format = "$git_branch$git_status$cmd_duration$battery$time"

scan_timeout = 100

[username]
show_always = true
style_user = "bold pink"
format = "[$user]($style) "

[character]
success_symbol = "[ ](bold pink)[](bold mauve)"
error_symbol = "[ ](bold red)[](bold mauve)"

[directory]
style = "bold mauve"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bold mauve"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "[$all_status$ahead_behind]($style) "
untracked = "?"
modified = "+"
staged = "*"

[cmd_duration]
min_time = 3000
style = "italic subtext0"
format = "[ $duration]($style) "

[battery]
full_symbol = "F "
charging_symbol = "C "
discharging_symbol = "D "
format = "[$symbol $percentage]($style) "

[[battery.display]]
threshold = 20
style = "bold red"

[[battery.display]]
threshold = 100
style = "italic subtext0"

[time]
disabled = true
time_format = "%R"
style = "bold subtext1"
format = "[ $time]($style)"

[status]
format = "[$symbol$common_meaning]($style) "
map_symbol = true
disabled = true

[status.symbol]
success = "ok"
error = "err"

[status.style]
success = "bold green"
error = "bold red"

