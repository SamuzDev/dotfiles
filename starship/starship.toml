palette = "noctalia"
add_newline = false

format = "$username$directory$character"
right_format = "$nodejs$rust$golang$git_branch$git_status"

scan_timeout = 100

[username]
show_always = true
style_user = "bold pink"
format = "[$user]($style) "

[hostname]
disabled = true

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold subtext0"
format = "[$path]($style) "

[character]
success_symbol = "[→](bold pink)"
error_symbol = "[→](bold red)"

[nodejs]
symbol = ""
style = "bold green"
format = "[$symbol $version]($style) "

[git_branch]
symbol = ""
style = "bold text"
format = "[$symbol $branch]($style) "

[git_status]
style = "bold yellow"
format = "[$all_status$ahead_behind]($style) "
untracked = "?"
modified = "+"
staged = "*"
stashed = ""

[rust]
symbol = ""
style = "bold peach"
format = "[$symbol $version]($style) "

[golang]
symbol = ""
style = "bold cyan"
format = "[$symbol $version]($style) "

[time]
disabled = true

[status]
disabled = true

