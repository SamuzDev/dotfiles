palette = "noctalia"
add_newline = false
truncation_length = 40
truncation_symbol = "…"

# Left: git branch + status + character
format = """$git_branch$git_status$character"""

# Right: compact info (max 40 chars to avoid overflow)
right_format = """$cmd_duration$python$nodejs$rust$golang$lua$battery$time"""

[character]
format = "$symbol"
success_symbol = "[ ❯ ](bold mauve)"
error_symbol = "[ ❯ ](bold flamingo)"

[git_branch]
symbol = " "
style = "bold text"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "[$all_status$ahead_behind]($style) "
untracked = "?"
modified = "+"
staged = "●"

[cmd_duration]
min_time = 2000
style = "italic subtext0"
format = "[ $duration]($style) "

[battery]
full_symbol = " "
charging_symbol = " "
discharging_symbol = " "
format = "[$symbol $percentage]($style) "

[[battery.display]]
threshold = 20
style = "bold red"

[[battery.display]]
threshold = 100
style = "italic subtext0"

[time]
disabled = false
time_format = "%R"
style = "bold subtext1"
format = "[ $time]($style)"

[python]
symbol = " "
style = "bold peach"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "bold teal"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "bold flamingo"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "bold sky"
format = "[$symbol$version]($style) "

[lua]
symbol = " "
style = "bold sapphire"
format = "[$symbol$version]($style) "

[package]
symbol = "   "
style = "bold subtext0"
format = "[$symbol$version]($style) "

[aws]
symbol = " "
style = "bold subtext0"
format = "[$symbol$profile]($style) "

