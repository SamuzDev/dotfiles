palette = "noctalia"
add_newline = false

# Lado izquierdo: Ruta limpia -> Rama Git -> Estado Git -> Flecha/Indicador
format = """$git_branch$git_status$character"""

# Lado derecho: Versión de lenguajes de programación y herramientas (Limpios)
right_format = """$python$nodejs$rust$golang$lua$package$aws"""

[directory]
home_symbol = "~"
truncation_length = 3
truncation_symbol = "…/"
style = "bold blue"
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "bold white"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "[$all_status$ahead_behind]($style) "
untracked = "?"
modified = "+"
staged = "●"

[character]
format = "$symbol"
# Variante A: El triángulo estilizado clásico de los mejores prompts premium
success_symbol = "[ ❯ ](bold magenta)"
error_symbol = "[ ❯ ](bold red)"

# Si prefieres la flecha idéntica a la que te puse antes pero estilizada en magenta:
# success_symbol = "[ ➜ ](bold magenta)"

[python]
symbol = " "
style = "bold yellow"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "bold red"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "bold cyan"
format = "[$symbol$version]($style) "

[lua]
symbol = " "
style = "bold blue"
format = "[$symbol$version]($style) "

[package]
symbol = "   "
style = "bold text"
format = "[$symbol$version]($style) "

[aws]
symbol = " "
style = "bold text"
format = "[$symbol$profile]($style) "

